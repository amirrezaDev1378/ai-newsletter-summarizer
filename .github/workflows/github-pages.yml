name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve Pages base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: newsletter-client
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: newsletter-client
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_PUBLIC_API_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.event.repository.default_branch }}/api/list.json

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newsletter-client/build/client
          force_orphan: true
