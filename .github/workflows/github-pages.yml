name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve Pages base path
        id: base
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [[ -z "$BASE" || "$BASE" == "/" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=${BASE%/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: newsletter-client
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: newsletter-client
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_PUBLIC_API_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.event.repository.default_branch }}/api/list.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newsletter-client/build/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
